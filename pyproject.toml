[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panorama-educacao"
version = "0.1.0"
description = "ETL local de indicadores do Censo Escolar por UF e ano para visualização estática"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1,<3", "requests>=2.31,<3", "openpyxl>=3.1,<4", "xlrd>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
panorama-educacao = "edu_panorama.cli:main"

[tool.setuptools.packages.find]
include = ["edu_panorama*"]
